name: Daily transfer update

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily (07:00 UK in summer)
  workflow_dispatch: {}    # manual "Run workflow" button
  push:
    branches: [main]       # also scrape on any code push (incl. first setup)
    paths-ignore: ["data/**"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Fetch latest transfers from FotMob
        run: node fetch-transfers.mjs
        continue-on-error: true
        id: fetch

      - name: Commit updated data
        run: |
          git config user.name "transfer-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/transfers.json
          git diff --cached --quiet || git commit -m "data: daily transfer update $(date -u +%F)"
          git push

      - name: Fail loudly if the scrape errored
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::FotMob fetch had errors — check the fetch step log above."
          exit 1
